# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repository.
# Set the values marked "sync: false" in the dashboard after the first deploy.
services:
  - type: web
    name: trip-reports
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        sync: false            # e.g. https://trip-reports.onrender.com
      - key: DATABASE_URL
        sync: false            # a Postgres URL, e.g. from Neon's free tier
      - key: STORAGE
        value: db              # photos in Postgres: the free web service has no persistent disk
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: LLM_API_KEY
        sync: false            # free AI: a Groq key from console.groq.com (optional)
      - key: LLM_MODEL
        value: openai/gpt-oss-120b   # the app also falls back to other current models by itself
      - key: CF_ACCOUNT_ID
        sync: false            # optional, free: Cloudflare Workers AI account id (overflow for gpt-oss-120b)
      - key: CF_API_TOKEN
        sync: false            # optional, free: Cloudflare API token with "Workers AI" permission
      - key: ANTHROPIC_API_KEY
        sync: false            # optional, paid: Claude instead of Groq
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false            # your login email(s), comma separated: they see the Admin page (pilot accounts)
      - key: BREVO_API_KEY
        sync: false            # free email sending (300/day) from brevo.com; Render's free tier blocks SMTP
      - key: MAIL_FROM
        sync: false            # a sender address verified in Brevo, e.g. your Gmail
      - key: LEGAL_ID
        sync: false            # optional: your NIF, shown in the legal pages
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
