<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf" content="{{ csrf }}">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<meta name="description" content="{{ _('Turn wildlife guides\' field notes into polished trip reports for their guests.') }}">
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<meta name="theme-color" content="#2E6A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ app_name }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css?v=5">
<link rel="stylesheet" href="/static/css/report.css?v=3">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block body %}{% endblock %}
<div class="toast" id="toast" role="status" aria-live="polite" {% if not flash %}hidden{% endif %}>{{ flash or '' }}</div>
<script type="application/json" id="i18n">{{ js_strings|tojson }}</script>
<script src="/static/js/app.js?v=5" defer></script>
{% if user %}<script src="/static/js/field.js?v=1" defer></script>{% endif %}
</body>
</html>
