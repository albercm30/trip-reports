{% extends "public/base_public.html" %}
{% block title %}{{ _('Log in') }} · {{ app_name }}{% endblock %}
{% block main %}
<div class="auth">
  <h1>{{ _('Log in') }}</h1>
  {% if error %}<p class="error" role="alert">{{ _(error) }}</p>{% endif %}
  <form method="post" action="/login" class="panel">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label class="field"><span>{{ _('Email') }}</span><input type="email" name="email" value="{{ email or '' }}" required autocomplete="email" autofocus></label>
    <label class="field"><span>{{ _('Password') }}</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary block">{{ _('Log in') }}</button>
  </form>
  <p class="hint" style="text-align:center;margin-top:14px"><a href="/forgot">{{ _('Forgot your password?') }}</a> · <a href="/signup">{{ _('Start free trial') }}</a></p>
</div>
{% endblock %}
